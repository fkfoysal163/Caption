<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Reel & Caption Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030712;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: #fff;
            padding: 10px;
        }

        /* মূল লেআউট (পিসিতে পাশাপাশি, মোবাইলে নিচে নিচে) */
        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
        }

        /* ৯:১৬ রিলস ফ্রেম (Responsive Size) */
        .reel-frame {
            width: 340px;
            height: 600px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        /* ব্যাকগ্রাউন্ড মোশন অরবস */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(55px);
            opacity: 0.45;
            animation: moveOrb 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 220px;
            height: 220px;
            background: #4f46e5;
            top: -50px;
            right: -50px;
        }

        .orb-2 {
            width: 240px;
            height: 240px;
            background: #ec4899;
            bottom: -50px;
            left: -50px;
            animation-delay: -4s;
        }

        @keyframes moveOrb {
            0% { transform: scale(0.9) translate(0, 0); }
            100% { transform: scale(1.2) translate(25px, -25px); }
        }

        /* ফ্লোটিং পার্টিকেলস */
        .sparkle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: sparkleAnim linear infinite;
        }

        @keyframes sparkleAnim {
            0% { transform: translateY(600px) scale(0.2); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
        }

        /* ক্যাপশন টেক্সট অ্যানিমেশন */
        .content-box {
            position: relative;
            z-index: 5;
            width: 100%;
            text-align: center;
        }

        #caption-text {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.45;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #caption-text.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* এডমিন প্যানেল */
        .admin-card {
            width: 100%;
            max-width: 360px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .admin-card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #6366f1;
        }

        .admin-card textarea {
            width: 100%;
            height: 180px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .admin-card textarea:focus {
            border-color: #6366f1;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .status-msg {
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
            color: #10b981;
        }

        /* রেকর্ড মোডের জন্য অ্যাডমিন হাইড করার সিএসএস */
        .hide-admin {
            display: none !important;
        }

        /* রেসপন্সিভ এডজাস্টমেন্ট (মোবাইল স্ক্রিনের জন্য) */
        @media (max-width: 480px) {
            .reel-frame {
                width: 92vw;
                height: 80vh;
                max-width: 360px;
                max-height: 640px;
            }
            #caption-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- ১. রিলস ভিডিও ডিসপ্লে -->
        <div class="reel-frame" id="reel">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="content-box">
                <div id="caption-text">তথ্য লোড হচ্ছে...</div>
            </div>
        </div>

        <!-- ২. অ্যাডমিন প্যানেল -->
        <div class="admin-card" id="adminPanel">
            <h2>⚙️ ক্যাপশন প্যানেল</h2>
            <textarea id="captionInput" placeholder="প্রতি লাইনে একটি করে ক্যাপশন লিখুন..."></textarea>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveToGoogleSheets()">আপডেট ও প্লে করুন 🚀</button>
                <button class="btn btn-secondary" onclick="toggleRecordMode()">🎬 রেকর্ড মোড অন করুন</button>
            </div>
            
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <!-- রেকর্ড মোড থেকে বের হওয়ার জন্য ছোট ফ্লোটিং বাটন -->
    <button id="exitRecordBtn" onclick="toggleRecordMode()" style="display:none; position: fixed; top: 10px; right: 10px; z-index: 100; padding: 6px 12px; background: rgba(255,255,255,0.2); border: 1px solid #fff; border-radius: 20px; color: #fff; font-size: 11px; backdrop-filter: blur(5px);">
        ✏️ এডমিন ফেরত আনুন
    </button>

    <script>
        // আপনার নতুন গুগল অ্যাপস স্ক্রিপ্ট ওয়েব অ্যাপ ইউআরএল
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSl44tptJ_n7iQYXbnElNgcIk1oqcfVp7gc-YF3xGU7PP_RxvNEXxHVkx_RwJuEkbQKQ/exec";

        let captions = [];
        let currentIndex = 0;
        const captionEl = document.getElementById("caption-text");
        const captionInput = document.getElementById("captionInput");
        const statusMsg = document.getElementById("statusMsg");
        const adminPanel = document.getElementById("adminPanel");
        const exitRecordBtn = document.getElementById("exitRecordBtn");

        // ব্যাকগ্রাউন্ড ধূলিকণা অ্যানিমেশন
        const reel = document.getElementById('reel');
        for (let i = 0; i < 18; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            const size = Math.random() * 3 + 1.5;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.animationDuration = `${Math.random() * 4 + 3}s`;
            sparkle.style.animationDelay = `${Math.random() * 4}s`;
            reel.appendChild(sparkle);
        }

        // বাংলা টিউন স্পিচ (Computer & Mobile Supported)
        function speakText(text, callback) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            utterance.rate = 0.85; 
            utterance.pitch = 1.05;

            utterance.onend = function() {
                setTimeout(callback, 500);
            };

            utterance.onerror = function() {
                setTimeout(callback, 1800);
            };

            window.speechSynthesis.speak(utterance);
        }

        // ক্যাপশন প্লেয়ার
        function playCaptions() {
            if (captions.length === 0) return;

            if (currentIndex < captions.length) {
                let currentText = captions[currentIndex];

                captionEl.classList.remove("show");

                setTimeout(() => {
                    captionEl.innerText = currentText;
                    captionEl.classList.add("show");

                    speakText(currentText, () => {
                        currentIndex++;
                        playCaptions();
                    });
                }, 350);
            } else {
                currentIndex = 0;
                setTimeout(playCaptions, 1000);
            }
        }

        // গুগল শিট থেকে তথ্য আনা
        function fetchCaptions() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.captions && data.captions.length > 0) {
                        captions = data.captions;
                        captionInput.value = captions.join('\n');
                        currentIndex = 0;
                        setTimeout(playCaptions, 800);
                    }
                })
                .catch(err => {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.innerText = "ডাটা লোড হতে সমস্যা হয়েছে!";
                });
        }

        // গুগল শিটে কন্টেন্ট সেভ করা (POST রিকোয়েস্ট উইথ রিডাইরেক্ট ফলো)
        function saveToGoogleSheets() {
            const lines = captionInput.value.split('\n').filter(line => line.trim() !== "");
            if (lines.length === 0) return;

            statusMsg.style.color = "#fbbf24";
            statusMsg.innerText = "সেভ হচ্ছে...";

            fetch(SCRIPT_URL, {
                method: 'POST',
                redirect: "follow",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ captions: lines })
            })
            .then(res => res.text())
            .then(text => {
                let data = JSON.parse(text);
                if (data.result === "success") {
                    statusMsg.style.color = "#10b981";
                    statusMsg.innerText = "গুগল শিটে সেভ হয়েছে! 🎉";
                    captions = lines;
                    currentIndex = 0;
                    playCaptions();
                } else {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.innerText = "সেভ করতে ব্যর্থ হয়েছে!";
                }
                setTimeout(() => { statusMsg.innerText = ""; }, 3000);
            })
            .catch(err => {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "কানেকশন এরর হয়েছে!";
            });
        }

        // স্ক্রিন রেকর্ডিংয়ের জন্য অ্যাডমিন প্যানেল হাইড/শো করার টগল
        function toggleRecordMode() {
            if (adminPanel.classList.contains("hide-admin")) {
                adminPanel.classList.remove("hide-admin");
                exitRecordBtn.style.display = "none";
            } else {
                adminPanel.classList.add("hide-admin");
                exitRecordBtn.style.display = "block";
            }
        }

        window.onload = fetchCaptions;
    </script>
</body>
</html>
